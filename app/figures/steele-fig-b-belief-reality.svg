<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="Fig. B: belief vs. reality mechanism (Steele, Wen &amp; Han 2026, §4.4)" font-family="var(--sans)">
<defs>
<marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--purple)"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--green)"/></marker>
</defs>
<style>
.tok{fill:var(--fg);font-size:11.5px} .ph{fill:var(--fg);font-size:13px;font-weight:600} .rl{font-size:11.5px;font-weight:700}
.k{fill:var(--muted);font-size:11px;font-family:var(--mono);letter-spacing:.06em} .s{fill:var(--muted);font-size:11.5px} .lab{fill:var(--fg);font-size:12px}
.vs{fill:var(--surface);stroke:var(--gray);stroke-width:1.5} .rd{fill:none;stroke-width:2.4;stroke-dasharray:1 4;stroke-linecap:round} .off{stroke:var(--muted);opacity:.3}
.q{fill:var(--fg);font-size:16px;font-weight:700;font-family:var(--serif)} .card{fill:var(--surface);stroke:var(--line)} .bgt{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
</style>
<text class="k" x="20" y="22">FIG. B · BELIEF VS. REALITY · STEELE, WEN &amp; HAN (2026), §4.4</text>
<text class="q" x="20" y="48">Same stored value format for both frames; the query’s router chooses which one is read.</text>
<g transform="translate(20,0)"><text class="ph" x="0" y="92">query “Anna thinks the cup is __” <tspan style="fill:var(--purple)">→ reads the belief</tspan></text><rect x="-6" y="205" width="482" height="140" rx="4" style="fill:var(--gray-soft);opacity:.45"/><line x1="45" y1="205" x2="45" y2="410" style="stroke:var(--line);stroke-width:1.5"/><line x1="192" y1="205" x2="192" y2="410" style="stroke:var(--line);stroke-width:1.5"/><line x1="330" y1="205" x2="330" y2="410" style="stroke:var(--line);stroke-width:1.5"/><line x1="121" y1="205" x2="121" y2="410" style="stroke:var(--muted);stroke-width:2.2"/><line x1="261" y1="205" x2="261" y2="410" style="stroke:var(--muted);stroke-width:2.2"/><line x1="420" y1="150" x2="420" y2="410" style="stroke:var(--muted);stroke-width:2.2"/><rect x="0" y="410" width="90" height="40" rx="6" style="fill:var(--surface);stroke:var(--line)"/><text class="tok" x="45.0" y="427" text-anchor="middle">Anna believes</text><text class="tok" x="45.0" y="442" text-anchor="middle">the cup is</text><rect x="96" y="410" width="50" height="40" rx="6" style="fill:var(--surface);stroke:var(--fg);stroke-width:1.5"/><text class="tok" x="121.0" y="435" text-anchor="middle" font-weight="700">blue</text><rect x="152" y="410" width="80" height="40" rx="6" style="fill:var(--surface);stroke:var(--line)"/><text class="tok" x="192.0" y="427" text-anchor="middle">In reality</text><text class="tok" x="192.0" y="442" text-anchor="middle">the cup is</text><rect x="238" y="410" width="46" height="40" rx="6" style="fill:var(--surface);stroke:var(--fg);stroke-width:1.5"/><text class="tok" x="261.0" y="435" text-anchor="middle" font-weight="700">red</text><rect x="296" y="410" width="174" height="40" rx="6" style="fill:var(--surface);stroke:var(--fg);stroke-width:1.5"/><text class="tok" x="383.0" y="427" text-anchor="middle">Anna thinks</text><text class="tok" x="383.0" y="442" text-anchor="middle">the cup is __</text><rect x="95" y="285" width="52" height="30" rx="6" class="vs"/><circle cx="121" cy="300" r="8" fill="#3f6fb5"/><rect x="235" y="285" width="52" height="30" rx="6" class="vs"/><circle cx="261" cy="300" r="8" fill="#c0504d"/><g><rect x="372" y="227" width="96" height="26" rx="13" style="fill:var(--purple-soft);stroke:var(--purple);stroke-width:2"/><text class="rl" x="420" y="244.5" text-anchor="middle" style="fill:var(--purple)">belief router</text></g><g opacity="0.35"><rect x="372" y="272" width="96" height="26" rx="13" style="fill:var(--surface);stroke:var(--green);stroke-width:1.2"/><text class="rl" x="420" y="289.5" text-anchor="middle" style="fill:var(--green)">reality router</text></g><path d="M147,296 C260,250 330,236 370,241" class="rd" style="stroke:var(--purple)" marker-end="url(#mp)"/><path d="M287,302 C340,296 360,284 370,286" class="rd off"/><path d="M420,150 L420,128" style="stroke:var(--muted);stroke-width:2" marker-end="url(#ma)"/><circle cx="420" cy="114" r="11" fill="#3f6fb5"/><text class="s bgt" x="434" y="118">readout</text></g>
<g transform="translate(510,0)"><text class="ph" x="0" y="92">query “In fact the cup is __” <tspan style="fill:var(--green)">→ reads reality</tspan></text><rect x="-6" y="205" width="482" height="140" rx="4" style="fill:var(--gray-soft);opacity:.45"/><line x1="45" y1="205" x2="45" y2="410" style="stroke:var(--line);stroke-width:1.5"/><line x1="192" y1="205" x2="192" y2="410" style="stroke:var(--line);stroke-width:1.5"/><line x1="330" y1="205" x2="330" y2="410" style="stroke:var(--line);stroke-width:1.5"/><line x1="121" y1="205" x2="121" y2="410" style="stroke:var(--muted);stroke-width:2.2"/><line x1="261" y1="205" x2="261" y2="410" style="stroke:var(--muted);stroke-width:2.2"/><line x1="420" y1="150" x2="420" y2="410" style="stroke:var(--muted);stroke-width:2.2"/><rect x="0" y="410" width="90" height="40" rx="6" style="fill:var(--surface);stroke:var(--line)"/><text class="tok" x="45.0" y="427" text-anchor="middle">Anna believes</text><text class="tok" x="45.0" y="442" text-anchor="middle">the cup is</text><rect x="96" y="410" width="50" height="40" rx="6" style="fill:var(--surface);stroke:var(--fg);stroke-width:1.5"/><text class="tok" x="121.0" y="435" text-anchor="middle" font-weight="700">blue</text><rect x="152" y="410" width="80" height="40" rx="6" style="fill:var(--surface);stroke:var(--line)"/><text class="tok" x="192.0" y="427" text-anchor="middle">In reality</text><text class="tok" x="192.0" y="442" text-anchor="middle">the cup is</text><rect x="238" y="410" width="46" height="40" rx="6" style="fill:var(--surface);stroke:var(--fg);stroke-width:1.5"/><text class="tok" x="261.0" y="435" text-anchor="middle" font-weight="700">red</text><rect x="296" y="410" width="174" height="40" rx="6" style="fill:var(--surface);stroke:var(--fg);stroke-width:1.5"/><text class="tok" x="383.0" y="427" text-anchor="middle">In fact</text><text class="tok" x="383.0" y="442" text-anchor="middle">the cup is __</text><rect x="95" y="285" width="52" height="30" rx="6" class="vs"/><circle cx="121" cy="300" r="8" fill="#3f6fb5"/><rect x="235" y="285" width="52" height="30" rx="6" class="vs"/><circle cx="261" cy="300" r="8" fill="#c0504d"/><g opacity="0.35"><rect x="372" y="227" width="96" height="26" rx="13" style="fill:var(--surface);stroke:var(--purple);stroke-width:1.2"/><text class="rl" x="420" y="244.5" text-anchor="middle" style="fill:var(--purple)">belief router</text></g><g><rect x="372" y="272" width="96" height="26" rx="13" style="fill:var(--green-soft);stroke:var(--green);stroke-width:2"/><text class="rl" x="420" y="289.5" text-anchor="middle" style="fill:var(--green)">reality router</text></g><path d="M287,300 C330,290 360,281 370,286" class="rd" style="stroke:var(--green)" marker-end="url(#mg)"/><path d="M147,300 C240,262 330,238 370,241" class="rd off"/><path d="M420,150 L420,128" style="stroke:var(--muted);stroke-width:2" marker-end="url(#ma)"/><circle cx="420" cy="114" r="11" fill="#c0504d"/><text class="s bgt" x="434" y="118">readout</text></g>
<!-- shared annotations (left panel coordinates) -->
<line x1="167" y1="300" x2="255" y2="300" style="stroke:var(--gray);stroke-dasharray:3 3"/>
<text class="lab bgt" x="211" y="333" text-anchor="middle">same value subspace · no frame tag</text>
<text class="lab bgt" x="440" y="220" text-anchor="middle">query-token routers</text>
<!-- interventions -->
<line x1="20" y1="476" x2="980" y2="476" stroke="var(--line)"/>
<text class="k" x="20" y="498">INTERVENTIONS (DAS)</text>
<!-- 1 swap value -->
<g transform="translate(20,510)">
 <rect class="vs" x="0" y="20" width="52" height="30" rx="6"/><circle cx="26" cy="35" r="8" fill="var(--orange)"/>
 <text class="s" x="0" y="14">donor value</text>
 <path d="M58,35 L96,35" style="stroke:var(--muted);stroke-width:2" marker-end="url(#ma)"/>
 <rect class="vs" x="102" y="20" width="52" height="30" rx="6"/><circle cx="128" cy="35" r="8" fill="var(--orange)"/>
 <text class="s" x="102" y="14">belief value</text>
 <text class="lab" x="170" y="31">answer → donor’s colour</text>
 <text class="s" x="170" y="47">in either frame: 0.87–0.95</text>
</g>
<!-- 2 splice router -->
<g transform="translate(360,510)">
 <rect x="0" y="22" width="78" height="26" rx="13" style="fill:var(--green-soft);stroke:var(--green);stroke-width:1.5"/><text class="rl" x="39" y="39" text-anchor="middle" style="fill:var(--green)">reality</text>
 <text class="s" x="0" y="14">from another story</text>
 <path d="M84,35 L112,35" style="stroke:var(--muted);stroke-width:2" marker-end="url(#ma)"/>
 <text class="lab" x="122" y="31">belief query reads reality</text>
 <text class="s" x="122" y="47">flip 1.00 · donor colour 0.00</text>
</g>
<!-- 3 ablate router -->
<g transform="translate(680,510)">
 <rect x="0" y="22" width="78" height="26" rx="13" style="fill:var(--purple-soft);stroke:var(--purple);stroke-width:1.5"/><text class="rl" x="39" y="39" text-anchor="middle" style="fill:var(--purple)">belief</text>
 <path d="M4,52 L74,18 M4,18 L74,52" style="stroke:var(--red);stroke-width:2"/>
 <text class="s" x="0" y="14">project out</text>
 <text class="lab" x="92" y="31">belief readout collapses</text>
 <text class="s" x="92" y="47">0.60 → 0.00; random subspace: no effect</text>
</g>
<text class="s" x="20" y="604">Shaded band: middle layers (0.25–0.75 depth). Dotted arrows: read path inferred from the interventions, not traced to heads.</text>
<text class="s" x="20" y="620">Value subspace drawn at the value token (§4.4; §3.4 says answer token). Qwen2.5-7B/14B, Mistral-7B, OLMo-2-7B; templated stories;</text><text class="s" x="20" y="636">comprehension of a story character’s belief, not the model’s own. Caveats in the note.</text>
</svg>