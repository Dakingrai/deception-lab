<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benchmark · Liars' Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">

<style>
/* Benchmark map, example first. A strip lays out the paper's evaluation (train -> threshold -> test, P5);
   each entry in it is a tab. The selected dataset shows one verified dishonest and honest example in full,
   on the same turns (P3). Filters are collapsed and only dim test tabs (P10 rule). Tokens only; docs/BRAND.md. */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-ui);line-height:var(--lh-ui)}
.wrap{max-width:var(--col-page);margin:0 auto;padding:var(--s-2) var(--s-4) var(--s-7)}
.k{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0}
h1{font-size:var(--fs-title);line-height:var(--lh-tight);font-weight:700;margin:var(--s-2) 0 var(--s-3)}
h2{font-size:var(--fs-h2);line-height:1.25;font-weight:600;margin:var(--s-1) 0 var(--s-2)}
.lede,.ptext{font-size:var(--fs-body);line-height:var(--lh-body);max-width:var(--col-text);margin:0 0 var(--s-3)}
a{color:var(--ink);text-decoration-color:var(--rule);text-underline-offset:2px}
a:hover{text-decoration-color:var(--ink)}
code{font-family:var(--mono);font-size:var(--fs-code);background:var(--surface-sunk);padding:0 4px;border-radius:var(--radius)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* train -> threshold -> test strip; every box is a tab */
.strip{display:flex;align-items:flex-end;gap:var(--s-2);flex-wrap:wrap;border-top:var(--border);border-bottom:var(--border);padding:var(--s-4) 0 var(--s-3);margin:var(--s-5) 0 0}
.stage{display:flex;flex-direction:column;gap:6px}
.stage .k{display:flex;align-items:center;gap:var(--s-2);min-height:22px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.arrow{color:var(--ink-3);font-size:18px;padding:0 2px 6px}
.tab{font:500 var(--fs-ui)/1.2 var(--mono);color:var(--ink);background:var(--surface);border:var(--border);border-radius:var(--radius);padding:7px 10px;cursor:pointer;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),opacity var(--dur-layout) var(--ease)}
.tab:hover{background:var(--surface-sunk)}
.tab[aria-selected="true"]{background:var(--surface-sunk);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tab.dim{opacity:.3}
.tab sup{font-family:var(--font);color:var(--ink-2);margin-left:1px}
.fbtn{font:600 var(--fs-ui) var(--font);color:var(--ink-2);background:none;border:var(--border);border-radius:var(--radius);padding:1px 8px;cursor:pointer;text-transform:none;letter-spacing:0}
.fbtn[aria-expanded="true"]{color:var(--ink);border-color:var(--ink)}
.stripnote{font-size:var(--fs-caption);color:var(--ink-2);max-width:var(--col-text);margin:var(--s-2) 0 0}

/* filters (collapsed by default) */
.filters{padding:var(--s-3) 0;border-bottom:var(--border)}
.facet{display:grid;grid-template-columns:170px minmax(0,1fr);gap:var(--s-1) var(--s-3);align-items:baseline;margin:0 0 var(--s-2)}
.facet>span{font-size:var(--fs-ui);color:var(--ink-2)}
.facet>span small{color:var(--ink-3);font-size:var(--fs-label);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:400 var(--fs-ui)/1.3 var(--font);color:var(--ink);background:var(--surface);border:var(--border);border-radius:var(--radius);padding:3px 8px;cursor:pointer}
.chip:hover{background:var(--surface-sunk)}
.chip[aria-pressed="true"]{background:var(--surface-sunk);border-color:var(--ink);font-weight:600}
.chip .n{font-family:var(--mono);font-size:var(--fs-label);color:var(--ink-3);margin-left:4px;font-weight:500}
.fstatus{display:flex;gap:var(--s-3);align-items:center;font-size:var(--fs-ui);color:var(--ink-2);margin-top:var(--s-2)}
.fstatus b{color:var(--ink)}
.btn{font:600 var(--fs-ui) var(--font);color:var(--ink);background:var(--surface);border:var(--border);border-radius:var(--radius);padding:3px 10px;cursor:pointer}
.btn:disabled{color:var(--ink-3);cursor:default}

/* the selected dataset */
#view{margin-top:var(--s-6)}
.meta{display:flex;flex-wrap:wrap;gap:4px var(--s-3);font-size:var(--fs-ui);color:var(--ink-2);margin:0 0 var(--s-3)}
.meta>span+span::before{content:"·";margin-right:var(--s-3);color:var(--ink-3)}
.meta .c-h{color:var(--honest-ink)} .meta .c-d{color:var(--deceptive-ink)}
.labelnotes{border-left:2px solid var(--ink);padding:2px 0 2px var(--s-4);max-width:var(--col-text);margin:0 0 var(--s-4)}
.labelnotes .k{margin-bottom:var(--s-2)}
.labelnotes ul{margin:0;padding-left:18px;display:grid;gap:var(--s-3)}
.labelnotes li b{display:block;font-size:var(--fs-h4);font-weight:600;margin-bottom:2px}
.labelnotes li span{display:block;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--ink-2)}
.mynote{background:var(--surface-sunk);border-radius:var(--radius);padding:var(--s-3) var(--s-4);max-width:var(--col-text);margin:var(--s-5) 0 0}
.mynote .mytext{font-size:var(--fs-body);font-weight:600;margin:4px 0 0;line-height:1.5}
.mynote ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--ink)}
.sampler{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-4);align-items:center;margin:var(--s-4) 0 0;padding:var(--s-2) var(--s-3);background:var(--interact-wash);border-radius:var(--radius)}
.sampler .sc{font-size:var(--fs-ui);color:var(--ink-2)}

.shuffle{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:600 var(--fs-ui) var(--font);color:var(--interact-ink);background:var(--bg);border:1.5px solid var(--interact);border-radius:var(--radius);padding:6px 14px;cursor:pointer;transition:background var(--dur) var(--ease)}
.shuffle:hover{background:var(--interact)}
.shuffle:hover{color:var(--ink)}
.dots{display:inline-flex;gap:6px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--interact);background:transparent;padding:0;cursor:pointer}
.dot.on{background:var(--interact)}
.dot:focus-visible,.shuffle:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sample{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-4);align-items:center;font-size:var(--fs-ui);color:var(--ink-2);margin:var(--s-4) 0 0}
.sample b{color:var(--ink);font-weight:600}
.lie{max-width:var(--col-text);margin:var(--s-4) 0 0;padding:var(--s-3) var(--s-4);border:var(--border);border-left:3px solid var(--deceptive);border-radius:var(--radius)}
.lie>.k{margin:0 0 var(--s-2)}
.lie dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:var(--s-2) var(--s-4);margin:0}
.lie dt{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding-top:3px}
.lie dd{margin:0;font-size:var(--fs-body);line-height:var(--lh-body);min-width:0;overflow-wrap:anywhere}
.lie q{font-style:normal;white-space:normal;quotes:"“" "”"}
.lie q.d{background:var(--deceptive-wash)} .lie q.h{background:var(--honest-wash)}
.lie .where{display:block;font-size:var(--fs-caption);color:var(--ink-2);margin-top:2px}
.lie .ev{font-style:italic;color:var(--ink-2)}
.lie dd.v{font-weight:600}
@media (max-width:640px){.lie dl{grid-template-columns:1fr}.lie dt{padding-top:var(--s-2)}}
.flag{border-left:2px solid var(--ink);padding:2px 0 2px var(--s-3);font-size:var(--fs-body);line-height:var(--lh-body);max-width:var(--col-text);margin:0 0 var(--s-3)}
figure{margin:var(--s-5) 0 0}
.pair{display:grid;border-top:var(--border)}
.pair.two{grid-template-columns:96px minmax(0,1fr) minmax(0,1fr)}
.pair.one{grid-template-columns:96px minmax(0,1fr)}
.pair.three{grid-template-columns:96px repeat(3,minmax(0,1fr))}
.pair>div{padding:var(--s-2) var(--s-4) var(--s-2) 0;border-bottom:var(--border);min-width:0}
.pair .hd{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.08em;text-transform:uppercase;padding-top:var(--s-3)}
.pair .hd.d{color:var(--deceptive-ink)} .pair .hd.h{color:var(--honest-ink)} .pair .hd.b{color:var(--ink)}
.mcol{display:none;font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.mcol.b{color:var(--ink)} .mcol.d{color:var(--deceptive-ink)} .mcol.h{color:var(--honest-ink)}
.pair .hd small{display:block;text-transform:none;letter-spacing:0;color:var(--ink-2);font-size:var(--fs-label);margin-top:2px}
.pair .role{font-family:var(--mono);font-size:var(--fs-label);color:var(--ink-2);padding-top:11px}
.pair .role small{display:block;color:var(--ink-2);font-size:var(--fs-label)}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--fs-body);line-height:1.6}
.msg.ref,.msg.empty{font-style:italic;color:var(--ink-2)}
.same{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:2px}
mark.xd{background:var(--deceptive-wash);color:inherit;border-bottom:1.5px solid var(--deceptive);padding:0 1px}
mark.xh{background:var(--honest-wash);color:inherit;border-bottom:1.5px solid var(--honest);padding:0 1px}
figcaption{font-size:var(--fs-caption);line-height:1.5;color:var(--ink-2);max-width:var(--col-text);margin-top:var(--s-3)}
figcaption b{color:var(--ink);font-weight:600}

/* secondary detail, collapsed */
details{border-top:var(--border);margin-top:var(--s-5);padding-top:var(--s-3);max-width:var(--col-page)}
details+details{margin-top:0}
summary{cursor:pointer;font-weight:600;font-size:var(--fs-h4);padding:2px 0 var(--s-2)}
.tagrow{display:grid;grid-template-columns:190px 210px minmax(0,1fr);gap:var(--s-1) var(--s-4);padding:var(--s-2) 0;border-bottom:var(--border);font-size:var(--fs-ui)}
.tagrow .k2{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tagrow .why{color:var(--ink-2);font-size:var(--fs-ui)}
.unc{border:1px dashed var(--ink-2);border-radius:var(--radius);padding:0 5px;font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;color:var(--ink-2);margin-left:6px}
ul.corr{margin:0 0 var(--s-3);padding-left:20px;max-width:var(--col-text);font-size:var(--fs-body);line-height:var(--lh-body)}
ul.corr li{margin:0 0 4px}
ul.corr li.d2{margin-left:20px;list-style:circle;color:var(--ink-2)}
.empty{color:var(--ink-2)}
/* paper list */
.papers{list-style:none;margin:var(--s-5) 0 0;padding:0;border-top:var(--border);max-width:var(--col-page)}
.papers li{border-bottom:var(--border)}
.papers button{all:unset;box-sizing:border-box;display:block;width:100%;padding:var(--s-4) var(--s-3);cursor:pointer;border-radius:var(--radius)}
.papers button:hover{background:var(--surface-sunk)}
.papers button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.papers .pt1{font-size:var(--fs-h3);font-weight:700;line-height:1.3;margin:0}
.papers .pm{font-size:var(--fs-ui);color:var(--ink-2);margin:4px 0 6px}
.papers .ps{font-size:var(--fs-body);line-height:var(--lh-body);margin:0;max-width:var(--col-text)}
.papers .pset{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:8px 0 0}
.backbar{margin:0 0 var(--s-4)}
table.rt{border-collapse:collapse;font-size:var(--fs-ui);margin:var(--s-3) 0 0;min-width:min(100%,560px)}
table.rt th,table.rt td{text-align:left;padding:7px 18px 7px 0;border-bottom:var(--border)}
table.rt th{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
table.rt td.num{font-variant-numeric:tabular-nums;font-weight:600}
table.rt tr.mk td{background:var(--surface-sunk)}
table.dt tr.pk{cursor:pointer}
table.dt tr.pk:hover td{background:var(--surface-sunk)}
table.dt tr.pk[aria-pressed="true"] td{background:var(--interact-wash)}
table.dt tr.pk[aria-pressed="true"] td:first-child{box-shadow:inset 3px 0 0 var(--interact)}
table.dt tr.pk:focus-visible{outline:2px solid var(--interact);outline-offset:-2px}
table.dt td.pkn{white-space:nowrap}
table.dt td.pkn small{display:block;font-family:var(--mono);font-size:var(--fs-label);color:var(--ink-2);font-weight:400}
.hint{font-style:italic;color:var(--interact-ink)}
.toclay{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s-6);margin-top:var(--s-4);align-items:start}
.toc{position:sticky;top:var(--s-4);font-size:var(--fs-ui);line-height:var(--lh-ui);border-right:var(--border);padding:var(--s-1) var(--s-4) var(--s-2) 0;will-change:transform}
.toc .tct{font-size:var(--fs-h3);font-weight:700;margin:0 0 var(--s-3)}
.toc a{display:block;color:var(--ink-2);text-decoration:none;padding:4px 0 4px var(--s-3);border-left:2px solid transparent;margin-left:-2px}
.toc a.l1{font-weight:600;color:var(--ink);margin-top:var(--s-2)}
.toc a.l2{padding-left:calc(var(--s-3) + 12px)}
.toc a:hover{color:var(--ink)}
.toc a.on{border-left-color:var(--ink);color:var(--ink)}
.tocbody{min-width:0}
.ddl{display:inline-flex;align-items:center;gap:var(--s-3);margin:0 0 var(--s-4);font-size:var(--fs-ui)}
.ddl span{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
select.dd{font:inherit;font-size:var(--fs-body);color:var(--ink);background:var(--interact-wash);border:1px solid var(--interact);border-radius:var(--radius);padding:6px 10px;max-width:100%;cursor:pointer}
select.dd:focus-visible{outline:2px solid var(--interact);outline-offset:2px}
.pkpanel{border-left:2px solid var(--interact);padding:2px 0 2px var(--s-4)}
.pkpanel h4.pkh{font-size:var(--fs-h3);margin:var(--s-1) 0 var(--s-3)}
.pkdl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:var(--s-2) var(--s-4);margin:0;font-size:var(--fs-ui);align-items:baseline}
.pkdl dt{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.pkdl dd{margin:0}.pkdl table.rt{margin:0}
.where{font-size:var(--fs-caption);color:var(--ink-2);font-weight:400}
ul.pknotes{margin:0 0 var(--s-3);padding-left:18px;display:grid;gap:var(--s-2);max-width:var(--col-text);font-size:var(--fs-body);line-height:var(--lh-body)}
.tocbody h3{font-size:var(--fs-h3);font-weight:600;line-height:var(--lh-tight);margin:var(--s-7) 0 var(--s-3);scroll-margin-top:var(--s-4)}
.tocbody .sec:first-child h3{margin-top:0}
.tocbody h4{font-size:var(--fs-h4);font-weight:600;margin:var(--s-5) 0 var(--s-2);scroll-margin-top:var(--s-4)}
@media (max-width:1000px){.toclay{grid-template-columns:1fr}.toc{position:static;border-right:0;border-bottom:var(--border);padding-bottom:var(--s-3)}}
.tblock{margin:0 0 var(--s-4)}
.tblock .ptext{font-size:var(--fs-ui);color:var(--ink-2);margin-top:var(--s-2)}
/* results */
svg{display:block;width:100%;height:auto}
.pt{font:600 var(--fs-ui) var(--font);fill:var(--ink)} .pn,.tk{font:500 var(--fs-label) var(--mono);fill:var(--ink-3)} .gl{font:500 var(--fs-ui) var(--mono);fill:var(--ink)}
.hit{cursor:default;outline:none} .hit:hover,.hit:focus{fill:var(--surface-sunk);fill-opacity:.6}
.lg{display:flex;flex-wrap:wrap;gap:var(--s-1) var(--s-4);font-size:var(--fs-ui);color:var(--ink-2);margin:0 0 var(--s-2)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg svg{width:14px;height:14px;flex:none}
.figscroll{overflow-x:auto}

.tip{position:fixed;z-index:5;max-width:290px;background:var(--surface);box-shadow:var(--shadow-pop);border-radius:var(--radius);padding:7px 10px;font-size:var(--fs-ui);line-height:1.45;pointer-events:none}

  table.dt td:first-child{white-space:normal}

}

<body>
<div class="wrap">
  <div id="list">
    <p class="k">Benchmark</p>
    <h1>Lie and deception benchmarks</h1>
    <p class="lede">Papers whose train and test sets we have unpacked. Pick one to see how its detector is trained, calibrated and tested, one dataset at a time, with verified dishonest and honest examples.</p>
    <ul class="papers" id="papers"></ul>
  </div>
  <div id="paper" hidden>
    <div class="backbar"><button class="btn" id="back" type="button">← All papers</button></div>
    <p class="k">Benchmark</p>
    <h1 id="ptitle"></h1>
    <p class="lede" id="plede"></p>
    <div class="strip" id="strip" role="tablist" aria-label="Datasets by role"></div>
    <p class="stripnote" id="stripnote"></p>
    <div class="filters" id="filters" hidden></div>
    <section id="view" aria-live="polite"></section>
  </div>
</div>
<div class="tip" id="tip" role="status" hidden></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('en-US');
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
const STAGES = [
  {role: 'train', name: 'Train the probe'},
  {role: 'threshold', name: 'Set the threshold'},
  {role: 'test', name: 'Test'},
  {role: 'appendix', name: 'Also tested (appendix)'},
  {role: 'results', name: 'Results'},
];
const PAPERS = [
  {id: 'liars-bench', h1: "Liars' Bench", title: "Liars' Bench: Evaluating Lie Detectors for Language Models", authors: 'Kretschmar, Laurito, Maiya and Marks (Cadenza Labs)', year: 2025, url: 'https://arxiv.org/abs/2511.16035',
   data: 'data.json', results: 'results.json', first: 'lb-id',
   summary: 'Seven test sets of lies from four open-weight models, and four lie detectors compared on all of them.',
   setup: 'Train: probe training pairs · Threshold: Alpaca · Test: 7 sets · 4 models'},
  {id: 'apollo', h1: 'Detecting Strategic Deception Using Linear Probes', title: 'Detecting Strategic Deception Using Linear Probes', authors: 'Goldowsky-Dill, Chughtai, Heimersheim and Hobbhahn (Apollo Research)', year: 2025, url: 'https://arxiv.org/abs/2502.03407',
   data: 'apollo.json', samples: 'apollo_samples.json', first: 'apollo-roleplaying',
   summary: 'One linear probe on Llama-3.3-70B-Instruct, trained on instructed pairs and tested on role-play, insider trading and sandbagging.',
   setup: 'Train: Instructed-Pairs · Threshold: Alpaca · Test: 4 sets (+2 in appendix) · 1 model'},

    ${d.table ? `<div class="tblock"><p class="k">${esc(d.table.title)}</p><div class="figscroll"><table class="rt"><thead><tr>${d.table.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${d.table.rows.map(r => `<tr>${r.map((v, i) => i ? `<td class="num">${esc(v)}</td>` : `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${d.table.note ? `<p class="ptext">${md(d.table.note)}</p>` : ''}</div>` : ''}
    ${d.layerNote ? `<p class="ptext" style="font-size:var(--fs-ui);color:var(--ink-2)">${esc(d.layerNote)} Source: <code>${esc(TF.source.config)}</code> in <a href="https://github.com/${TF.source.repo}/tree/${TF.source.commit}" target="_blank" rel="noopener">${esc(TF.source.repo)} @ ${esc(TF.source.commit.slice(0, 7))}</a>, pinned as a submodule by <a href="https://github.com/Cadenza-Labs/liars-bench" target="_blank" rel="noopener">Cadenza-Labs/liars-bench</a>.</p>` : ''}
    ${d.flag ? `<p class="flag">${md(d.flag)}</p>` : ''}${d.redaction ? `<p class="flag">${md(d.redaction)}${d.pairNote ? ' ' + md(d.pairNote) : ''}</p>` : d.pairNote ? `<p class="flag">${md(d.pairNote)}</p>` : ''}
    ${d.role === 'test' && RES ? `<figure class="fig" data-pattern="P2" data-width="page"><p class="k" style="margin-bottom:var(--s-2)">How the detectors did on ${esc(d.abbr)}</p>${legend()}${forest([d.abbr])}
      <figcaption><b>${esc(subsetClaim(d.abbr))}</b> ${ENC} All subsets are in the Results tab.</figcaption></figure>` : ''}
    ${tags ? `<details><summary>Our tags (Map 4)</summary>${tags}</details>` : ''}
    ${verify}
    ${d.personalNote ? `<div class="mynote"><p class="k">My note · ${esc(d.personalNote.date)}</p><p class="mytext">${md(d.personalNote.text)}</p><p class="k" style="margin-top:var(--s-3)">${esc(d.personalNote.reasonsTitle || 'Why')}</p><ul>${d.personalNote.reasons.map(r => `<li>${md(r)}</li>`).join('')}</ul></div>` : ''}`;
  post();
}

/* the Deception Lab shell hosts this page in an iframe and sizes it from this message */
function post() { try { parent.postMessage({benchh: document.documentElement.scrollHeight}, '*'); } catch (e) {} }
if (window.ResizeObserver) new ResizeObserver(post).observe(document.body);
</script>
